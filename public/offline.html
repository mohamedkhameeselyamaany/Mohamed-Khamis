<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تصفح أوفلاين | Offline</title>
    <meta name="theme-color" content="#0b0f19" />
    <link rel="apple-touch-icon" href="logo192.png" />
    <style>
      body {
        margin: 0;
        font-family: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #0b0f19;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        box-sizing: border-box;
      }
      .card {
        width: min(520px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 32px 24px;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        text-align: center;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      }
      .logo {
        width: 80px;
        height: 80px;
        margin-bottom: 16px;
        border-radius: 20px;
        object-fit: cover;
        box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
      }
      h1 {
        margin: 0 0 10px 0;
        font-size: 24px;
        font-weight: 800;
        color: #ffffff;
      }
      h2 {
        margin: 0 0 16px 0;
        font-size: 16px;
        font-weight: 600;
        color: #94a3b8;
      }
      p {
        margin: 0 0 12px 0;
        color: #cbd5e1;
        line-height: 1.6;
        font-size: 15px;
      }
      .btn {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 28px;
        background: #6366f1;
        color: #ffffff;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 700;
        font-size: 15px;
        transition: all 0.25s ease;
        border: none;
        cursor: pointer;
      }
      .btn:hover {
        background: #4f46e5;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
      }
      .hint {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 13px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="card" role="status" aria-live="polite">
      <img class="logo" src="logo192.png" alt="Mohamed Khamis" />
      <h1>أنت تتصفح بدون اتصال بالإنترنت</h1>
      <h2>You are currently offline</h2>
      <p>
        يمكنك الاستمرار في تصفح محتوى البورتفوليو والمشاريع المخزنة مسبقاً بشكل كامل.
      </p>
      <p style="font-size: 14px; opacity: 0.85;">
        You can still browse all previously cached portfolio sections and projects.
      </p>
      <a href="./" class="btn">العودة للبورتفوليو | Open Portfolio</a>
      <div class="hint">
        💡 عند عودة الاتصال، سيتم تحديث المحتوى تلقائياً.
      </div>
    </div>
  </body>
</html>
