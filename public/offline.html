<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #0b0b0b;
        color: #ffffff;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: min(560px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 24px;
        background: rgba(255, 255, 255, 0.04);
      }
      h1 {
        margin: 0 0 12px 0;
        font-size: 24px;
      }
      p {
        margin: 0;
        opacity: 0.9;
        line-height: 1.6;
      }
      .hint {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 14px;
        opacity: 0.85;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin-bottom: 12px;
        border-radius: 18px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card" role="status" aria-live="polite">
        <img class="logo" src="%PUBLIC_URL%/logo.png" alt="Logo" />
        <h1>You're Offline</h1>
        <p>
          It looks like you're not connected to the internet. You can still access cached content.
        </p>
        <div class="hint">
          Tip: If you regain connection, refresh the page to update the latest content.
        </div>
      </div>
    </div>
  </body>
</html>
